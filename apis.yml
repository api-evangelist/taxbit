aid: taxbit
name: TaxBit
description: >-
  TaxBit is an end-to-end tax compliance and information-reporting platform for
  the digital economy, serving enterprises and governments across 70+
  jurisdictions and 140+ countries. Its API turns transaction data into accurate
  cost basis, realized gains (IRS Form 8949 / 1099-B), and regulatory filings,
  and handles tax-documentation collection (W-9, W-8BEN, W-8BEN-E,
  self-certification), US TIN validation, DAC7 digital-platform-seller
  reporting, and CARF/DAC8 crypto-asset reporting. The REST API (documented at
  apidocs.taxbit.com) authenticates with tenant-scoped and account-owner-scoped
  bearer tokens, and TaxBit ships embeddable React/browser SDKs for collecting
  tax documentation directly inside customer apps.
